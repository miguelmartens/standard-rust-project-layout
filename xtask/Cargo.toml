[package]
name = "xtask"
description = "Repository automation, written in Rust instead of Make."

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Automation is not a product. Publishing it would put a crate called `xtask` on
# crates.io that does nothing for anyone.
publish = false

[lints]
workspace = true

# Intentionally empty, and it should stay that way.
#
# Every dependency here is compile time paid by every contributor before their
# first `cargo xtask ci`. matklad's advice on the pattern: "It is advisable to
# minimize the compile time of xtasks." std can shell out to `cargo`, which is
# most of what automation ever needs.
[dependencies]
